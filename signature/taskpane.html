<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOOD Signature</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

<style>body{font-family:Cairo,'Segoe UI',Arial,sans-serif;color:#041e42;background:#fff;margin:0;padding:16px}

button{background:#041e42;color:#fff;border:0;border-radius:6px;padding:10px 16px;font:600 14px Cairo,Arial;cursor:pointer}

<h1>ZOOD Signature · توقيع زود</h1>
<p>Your signature is added automatically to every new email, reply and forward. If it does not appear, press Activate once.</p>
<p dir="rtl">يُضاف توقيعك تلقائيًا إلى كل رسالة جديدة وكل رد وكل إعادة توجيه. إذا لم يظهر، اضغط زر التفعيل مرة واحدة.</p>
<button id="activate">Activate · تفعيل</button>
<p id="status"></p>
<div id="preview"></div>
<script src="taskpane.js"></script>
</body></html>
